<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>語音輸入</title>
<style>body{font:18px system-ui;background:#121820;color:#eef3fa;margin:24px auto;padding:0 20px;max-width:620px}button,select,textarea{font:inherit;border-radius:10px;padding:14px;margin:6px 0;box-sizing:border-box}button{background:#93c5fd;color:#101820;border:0;min-height:52px}textarea{width:100%;height:240px;background:#202c3a;color:white;border:1px solid #64748b}select{width:100%}p{line-height:1.5}#status{color:#b9d9ff;min-height:80px;white-space:pre-wrap}.buttons{display:flex;gap:10px;flex-wrap:wrap}small{color:#aab8ca}</style>
<div class="buttons" style="justify-content:space-between;align-items:center"><h1>語音輸入</h1><select id="ui-language" style="width:auto"><option value="en">English</option><option value="zh">中文</option><option value="es">Español</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div><p>按開始後說一段話；結束後可直接點文字修改，再保存到首頁。</p>
<select id="language"><option value="zh-TW">中文（台灣）</option><option value="zh-CN">中文（普通話）</option><option value="en-US">English</option><option value="es-ES">Español</option><option value="de-DE">Deutsch</option><option value="fr-FR">Français</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option><option value="th-TH">ไทย</option></select>
<div class="buttons"><button id="chinese">說中文</button><button id="english">Speak English</button></div><p><small>中英混說可能誤判。說英文前點 English，說完切回中文，文字會接在同一段。</small></p><div class="buttons"><button id="start">開始語音輸入</button><button id="stop" disabled>停止</button></div><p id="status" role="status" aria-live="polite">準備好了。首次使用請允許瀏覽器使用麥克風。</p>
<div id="alternatives"></div><textarea id="text" placeholder="辨識文字會出現在這裡，也可以手動修改。"></textarea>
<div class="buttons"><button id="save">保存到首頁</button><button id="copy">複製文字</button><button id="clear">清空</button></div>
<p>回首頁「語音輸入」工具，按「送到目前目標」，不用複製貼上。</p><small>辨識使用瀏覽器的語音服務，可能將音訊傳給服務供應商。文字不會自動送到目前目標。</small>
<script>
const $=id=>document.getElementById(id),status=$('status'),text=$('text');
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);

// Chinese is what the page is written in; the other interface languages are looked up here.
const UI_STRINGS = {"語音輸入": {"en": "Dictation", "es": "Dictado", "de": "Diktat", "fr": "Dictée", "ja": "音声入力", "ko": "받아쓰기"}, "按開始後說一段話；結束後可直接點文字修改，再保存到首頁。": {"en": "Tap Start and speak. Edit the text after stopping, then save it to the home screen.", "es": "Toca Iniciar y habla. Al parar puedes corregir el texto y guardarlo en la pantalla de inicio.", "de": "Starten antippen und sprechen. Nach dem Stoppen den Text bearbeiten und auf dem Startbildschirm speichern.", "fr": "Touchez Démarrer et parlez. Après l’arrêt, corrigez le texte puis enregistrez-le sur l’écran d’accueil.", "ja": "開始をタップして話します。停止後にテキストを直して、ホーム画面に保存できます。", "ko": "시작을 누르고 말하세요. 정지한 뒤 텍스트를 고치고 홈 화면에 저장할 수 있습니다."}, "說中文": {"en": "Speak Chinese", "es": "Hablar español", "de": "Deutsch sprechen", "fr": "Parler français", "ja": "日本語で話す", "ko": "한국어로 말하기"}, "中英混說可能誤判。說英文前點 English，說完切回中文，文字會接在同一段。": {"en": "Mixed languages may be misheard. Switch the language before you speak another one; your text is kept.", "es": "Mezclar idiomas puede dar errores. Cambia de idioma antes de hablar en otro; el texto se conserva.", "de": "Gemischte Sprachen werden leicht falsch erkannt. Vor dem Wechsel die Sprache umstellen; der Text bleibt erhalten.", "fr": "Mélanger les langues peut causer des erreurs. Changez de langue avant de parler dans une autre ; le texte est conservé.", "ja": "言語を混ぜると誤認識することがあります。話す言語を変える前に切り替えてください。テキストは残ります。", "ko": "언어를 섞으면 잘못 인식될 수 있습니다. 다른 언어로 말하기 전에 언어를 바꾸세요. 텍스트는 유지됩니다."}, "開始語音輸入": {"en": "Start dictation", "es": "Iniciar dictado", "de": "Diktat starten", "fr": "Démarrer la dictée", "ja": "音声入力を開始", "ko": "받아쓰기 시작"}, "停止": {"en": "Stop", "es": "Parar", "de": "Stopp", "fr": "Arrêter", "ja": "停止", "ko": "정지"}, "準備好了。首次使用請允許瀏覽器使用麥克風。": {"en": "Ready. Allow microphone access when asked.", "es": "Listo. Permite el micrófono cuando el navegador lo pida.", "de": "Bereit. Mikrofon erlauben, wenn der Browser fragt.", "fr": "Prêt. Autorisez le micro quand le navigateur le demande.", "ja": "準備完了。ブラウザに求められたらマイクを許可してください。", "ko": "준비됐습니다. 브라우저가 물으면 마이크를 허용하세요."}, "辨識文字會出現在這裡，也可以手動修改。": {"en": "Recognized text appears here. You can edit it.", "es": "El texto reconocido aparece aquí. Puedes corregirlo.", "de": "Der erkannte Text erscheint hier und kann bearbeitet werden.", "fr": "Le texte reconnu apparaît ici. Vous pouvez le corriger.", "ja": "認識したテキストがここに表示されます。編集もできます。", "ko": "인식된 텍스트가 여기에 나타납니다. 고칠 수 있습니다."}, "保存到首頁": {"en": "Save to home", "es": "Guardar en inicio", "de": "Auf Start speichern", "fr": "Enregistrer sur l’accueil", "ja": "ホームに保存", "ko": "홈에 저장"}, "複製文字": {"en": "Copy text", "es": "Copiar texto", "de": "Text kopieren", "fr": "Copier le texte", "ja": "テキストをコピー", "ko": "텍스트 복사"}, "清空": {"en": "Clear", "es": "Borrar", "de": "Leeren", "fr": "Effacer", "ja": "クリア", "ko": "지우기"}, "回首頁「語音輸入」工具，按「送到目前目標」，不用複製貼上。": {"en": "Return to the Dictation widget and tap Send to target.", "es": "Vuelve al widget Dictado y toca Enviar al destino.", "de": "Zurück zum Diktat-Widget und An Ziel senden antippen.", "fr": "Revenez au widget Dictée et touchez Envoyer à la cible.", "ja": "音声入力ウィジェットに戻り、「送信先に送る」をタップします。", "ko": "받아쓰기 위젯으로 돌아가 대상으로 보내기를 누르세요."}, "辨識使用瀏覽器的語音服務，可能將音訊傳給服務供應商。文字不會自動送到目前目標。": {"en": "Browser speech recognition may send audio to its provider. Saving does not automatically send text to the selected target.", "es": "El reconocimiento de voz del navegador puede enviar audio al proveedor del servicio. Guardar no envía el texto al destino.", "de": "Die Spracherkennung des Browsers kann Audio an ihren Anbieter senden. Speichern sendet den Text nicht an das Ziel.", "fr": "La reconnaissance vocale du navigateur peut envoyer l’audio à son fournisseur. Enregistrer n’envoie pas le texte à la cible.", "ja": "ブラウザの音声認識は音声を提供元に送ることがあります。保存しただけでは送信先に送られません。", "ko": "브라우저 음성 인식은 오디오를 제공업체로 보낼 수 있습니다. 저장만으로는 대상에 전송되지 않습니다."}, "正在聽… 說完按停止；點文字框可立即編輯。": {"en": "Listening… Tap Stop when finished; tap the text box to edit.", "es": "Escuchando… Toca Parar al terminar; toca el texto para corregir.", "de": "Höre zu… Zum Schluss Stopp antippen; Text antippen zum Bearbeiten.", "fr": "Écoute… Touchez Arrêter à la fin ; touchez le texte pour corriger.", "ja": "聞き取り中… 終わったら停止をタップ。テキストをタップすると編集できます。", "ko": "듣는 중… 끝나면 정지를 누르세요. 텍스트를 누르면 고칠 수 있습니다."}, "辨識已停止。直接點文字框修改，再保存到首頁。": {"en": "Recognition stopped. Edit the text, then save it.", "es": "Reconocimiento detenido. Corrige el texto y guárdalo.", "de": "Erkennung beendet. Text bearbeiten, dann speichern.", "fr": "Reconnaissance arrêtée. Corrigez le texte, puis enregistrez.", "ja": "認識を停止しました。テキストを直して保存してください。", "ko": "인식이 멈췄습니다. 텍스트를 고친 뒤 저장하세요."}, "已暫停聽寫，現在可直接編輯文字。": {"en": "Dictation paused. You can edit the text.", "es": "Dictado en pausa. Puedes corregir el texto.", "de": "Diktat pausiert. Der Text kann bearbeitet werden.", "fr": "Dictée en pause. Vous pouvez corriger le texte.", "ja": "音声入力を一時停止しました。テキストを編集できます。", "ko": "받아쓰기를 멈췄습니다. 텍스트를 고칠 수 있습니다."}, "已停止，可保存文字。": {"en": "Stopped. You can save the text.", "es": "Detenido. Puedes guardar el texto.", "de": "Gestoppt. Der Text kann gespeichert werden.", "fr": "Arrêté. Vous pouvez enregistrer le texte.", "ja": "停止しました。テキストを保存できます。", "ko": "정지됨. 텍스트를 저장할 수 있습니다."}, "已清空。": {"en": "Cleared.", "es": "Borrado.", "de": "Geleert.", "fr": "Effacé.", "ja": "クリアしました。", "ko": "지웠습니다."}, "正在停止…": {"en": "Stopping…", "es": "Parando…", "de": "Stoppe…", "fr": "Arrêt…", "ja": "停止中…", "ko": "정지하는 중…"}, "保存失敗：": {"en": "Save failed: ", "es": "Error al guardar: ", "de": "Speichern fehlgeschlagen: ", "fr": "Échec de l’enregistrement : ", "ja": "保存に失敗：", "ko": "저장 실패: "}, "已保存。回首頁「語音輸入」按「送到目前目標」。": {"en": "Saved. Return to the Dictation widget and tap Send to target.", "es": "Guardado. Vuelve al widget Dictado y toca Enviar al destino.", "de": "Gespeichert. Zurück zum Diktat-Widget und An Ziel senden antippen.", "fr": "Enregistré. Revenez au widget Dictée et touchez Envoyer à la cible.", "ja": "保存しました。音声入力ウィジェットに戻り、「送信先に送る」をタップします。", "ko": "저장했습니다. 받아쓰기 위젯으로 돌아가 대상으로 보내기를 누르세요."}, "已複製。": {"en": "Copied.", "es": "Copiado.", "de": "Kopiert.", "fr": "Copié.", "ja": "コピーしました。", "ko": "복사했습니다."}, "請長按選取的文字並複製。": {"en": "Long-press the selected text to copy it.", "es": "Mantén pulsado el texto seleccionado para copiarlo.", "de": "Markierten Text lange drücken, um ihn zu kopieren.", "fr": "Appuyez longuement sur le texte sélectionné pour le copier.", "ja": "選択したテキストを長押ししてコピーしてください。", "ko": "선택한 텍스트를 길게 눌러 복사하세요."}, "此瀏覽器不支援語音辨識，請使用 Chrome 開啟。": {"en": "This browser does not support speech recognition. Open in Chrome.", "es": "Este navegador no admite el reconocimiento de voz. Ábrelo en Chrome.", "de": "Dieser Browser unterstützt keine Spracherkennung. In Chrome öffnen.", "fr": "Ce navigateur ne prend pas en charge la reconnaissance vocale. Ouvrez dans Chrome.", "ja": "このブラウザは音声認識に対応していません。Chrome で開いてください。", "ko": "이 브라우저는 음성 인식을 지원하지 않습니다. Chrome 에서 여세요."}, "麥克風權限被拒絕。請到 Android 設定 → 應用程式 → 目前瀏覽器 → 權限 → 麥克風，並在瀏覽器的本站設定允許麥克風。給 omalauncher 權限不會同時授權瀏覽器。": {"en": "Microphone denied. Allow the browser microphone permission in Android settings and browser site settings.", "es": "Micrófono denegado. Permite el micrófono al navegador en los ajustes de Android y en los ajustes del sitio.", "de": "Mikrofon verweigert. Dem Browser das Mikrofon in den Android-Einstellungen und den Website-Einstellungen erlauben.", "fr": "Micro refusé. Autorisez le micro pour le navigateur dans les réglages Android et les réglages du site.", "ja": "マイクが拒否されました。Android の設定とブラウザのサイト設定でマイクを許可してください。", "ko": "마이크가 거부되었습니다. Android 설정과 브라우저 사이트 설정에서 마이크를 허용하세요."}, "瀏覽器不允許此語音服務，請用 Chrome 開啟。": {"en": "Speech service blocked. Try Chrome.", "es": "Servicio de voz bloqueado. Prueba con Chrome.", "de": "Sprachdienst blockiert. Chrome versuchen.", "fr": "Service vocal bloqué. Essayez Chrome.", "ja": "音声サービスがブロックされました。Chrome をお試しください。", "ko": "음성 서비스가 차단되었습니다. Chrome 을 써 보세요."}, "無法取得麥克風。請確認瀏覽器權限，並關閉其他正在錄音的程式。": {"en": "Microphone unavailable. Check browser permissions and close other recording apps.", "es": "Micrófono no disponible. Revisa los permisos del navegador y cierra otras apps que graben.", "de": "Mikrofon nicht verfügbar. Browser-Berechtigungen prüfen und andere Aufnahme-Apps schließen.", "fr": "Micro indisponible. Vérifiez les autorisations du navigateur et fermez les autres applis qui enregistrent.", "ja": "マイクを使用できません。ブラウザの権限を確認し、録音中の他のアプリを閉じてください。", "ko": "마이크를 쓸 수 없습니다. 브라우저 권한을 확인하고 녹음 중인 다른 앱을 닫으세요."}, "語音服務連線失敗，請檢查網路後重試。": {"en": "Speech service network error. Check connection and retry.", "es": "Error de red del servicio de voz. Revisa la conexión y reintenta.", "de": "Netzwerkfehler beim Sprachdienst. Verbindung prüfen und erneut versuchen.", "fr": "Erreur réseau du service vocal. Vérifiez la connexion et réessayez.", "ja": "音声サービスのネットワークエラー。接続を確認して再試行してください。", "ko": "음성 서비스 네트워크 오류. 연결을 확인하고 다시 시도하세요."}, "沒聽到聲音，請按開始重試。": {"en": "No speech heard. Tap Start to retry.", "es": "No se oyó nada. Toca Iniciar para reintentar.", "de": "Nichts gehört. Starten antippen, um es erneut zu versuchen.", "fr": "Rien entendu. Touchez Démarrer pour réessayer.", "ja": "音声が聞こえませんでした。開始をタップして再試行してください。", "ko": "소리가 들리지 않았습니다. 시작을 눌러 다시 시도하세요."}, "此語音服務不支援所選語言，請切換語言。": {"en": "This speech service does not support the selected language.", "es": "Este servicio de voz no admite el idioma elegido.", "de": "Dieser Sprachdienst unterstützt die gewählte Sprache nicht.", "fr": "Ce service vocal ne prend pas en charge la langue choisie.", "ja": "この音声サービスは選択した言語に対応していません。", "ko": "이 음성 서비스는 선택한 언어를 지원하지 않습니다."}, "語音已停止。": {"en": "Speech stopped.", "es": "Voz detenida.", "de": "Sprache gestoppt.", "fr": "Voix arrêtée.", "ja": "音声を停止しました。", "ko": "음성이 멈췄습니다."}, "先按停止，再選候選文字。": {"en": "Tap Stop before choosing another transcript.", "es": "Toca Parar antes de elegir otra transcripción.", "de": "Vor der Wahl einer anderen Fassung Stopp antippen.", "fr": "Touchez Arrêter avant de choisir une autre transcription.", "ja": "別の候補を選ぶ前に停止をタップしてください。", "ko": "다른 후보를 고르기 전에 정지를 누르세요."}, "這句已修改，請直接編輯文字。": {"en": "This sentence was edited; change it directly.", "es": "Esta frase fue editada; cámbiala directamente.", "de": "Dieser Satz wurde bearbeitet; bitte direkt ändern.", "fr": "Cette phrase a été modifiée ; changez-la directement.", "ja": "この文は編集済みです。直接修正してください。", "ko": "이 문장은 수정되었습니다. 직접 고치세요."}, "最近一句候選（停止後可選）：": {"en": "Alternatives for the last phrase (select after stopping):", "es": "Alternativas para la última frase (elige tras parar):", "de": "Alternativen für den letzten Satz (nach dem Stoppen wählen):", "fr": "Variantes de la dernière phrase (à choisir après l’arrêt) :", "ja": "最後の文の候補（停止後に選択）：", "ko": "마지막 문장의 후보(정지 후 선택):"}, "請從首頁「語音輸入」重新開啟。": {"en": "Reopen from the Dictation widget.", "es": "Vuelve a abrir desde el widget Dictado.", "de": "Über das Diktat-Widget erneut öffnen.", "fr": "Rouvrez depuis le widget Dictée.", "ja": "音声入力ウィジェットから開き直してください。", "ko": "받아쓰기 위젯에서 다시 여세요."}, "辨識錯誤：": {"en": "Recognition error: ", "es": "Error de reconocimiento: ", "de": "Erkennungsfehler: ", "fr": "Erreur de reconnaissance : ", "ja": "認識エラー：", "ko": "인식 오류: "}, "無法開始：": {"en": "Could not start: ", "es": "No se pudo iniciar: ", "de": "Start nicht möglich: ", "fr": "Impossible de démarrer : ", "ja": "開始できません：", "ko": "시작할 수 없음: "}};
let uiLanguage='zh';
// The language spoken by default for each interface language.
const SPEECH={en:'en-US',zh:'zh-TW',es:'es-ES',de:'de-DE',fr:'fr-FR',ja:'ja-JP',ko:'ko-KR'};
const originalNodes=[];
const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
while(walker.nextNode()){const node=walker.currentNode;if(UI_STRINGS[node.textContent.trim()])originalNodes.push([node,node.textContent.trim()]);}
const originalPlaceholder=$('text').getAttribute('placeholder');
let updatingStatus=false;
function localize(value){if(uiLanguage==='zh')return value;for(const [zh,texts] of Object.entries(UI_STRINGS)){const text=texts[uiLanguage]||texts.en;if(value===zh)return text;if(value.startsWith(zh) && zh.endsWith('：'))return text+value.slice(zh.length);}return value;}
function applyLanguage(){
 document.documentElement.lang=uiLanguage==='zh'?'zh-Hant':uiLanguage;
 for(const [node,zh] of originalNodes)node.textContent=localize(zh);
 $('text').placeholder=localize(originalPlaceholder);
 $('ui-language').value=uiLanguage;
 // English has its own button beside this one.
 $('chinese').hidden=uiLanguage==='en';
 const raw=status.dataset.original || status.textContent;status.textContent=localize(raw);
}
const statusObserver=new MutationObserver(()=>{if(updatingStatus)return;updatingStatus=true;let v=status.textContent;const old=status.dataset.original;if(v!==localize(old||'')){status.dataset.original=v;const translated=localize(v);if(translated!==v)status.textContent=translated;}updatingStatus=false;});
statusObserver.observe(status,{childList:true,characterData:true,subtree:true});
$('ui-language').onchange=async()=>{
 const value=$('ui-language').value;
 try{const response=await fetch('/language',{method:'POST',headers:{'Content-Type':'application/json','X-Speak-Token':token},body:JSON.stringify({language:value})});if(!response.ok)throw Error(await response.text());uiLanguage=value;applyLanguage();}
 catch(error){$('ui-language').value=uiLanguage;status.textContent='Language change failed: '+error.message;}
};
fetch('/language').then(r=>r.text()).then(value=>{uiLanguage=SPEECH[value.trim()]?value.trim():'en';applyLanguage();if(!localStorage.getItem('oma-speak-language'))$('language').value=SPEECH[uiLanguage];}).catch(()=>{});

const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null,wanted=false,timer=null,failures=0,committed='',interim='',afterStop=null;
text.value=localStorage.getItem('oma-speak-draft')||'';
$('language').value=localStorage.getItem('oma-speak-language')||'zh-TW';
function persist(){localStorage.setItem('oma-speak-draft',text.value);}
text.oninput=persist;
function controls(){ $('start').disabled=wanted||!!recognition||!Speech;$('stop').disabled=!wanted&&!recognition;$('language').disabled=wanted||!!recognition;text.readOnly=false; }
function halt(message){wanted=false;clearTimeout(timer);status.textContent=message;controls();}
function startSession(){
 if(!wanted||recognition)return;
 const r=new Speech();recognition=r;const base=text.value;committed=base;interim='';
 r.lang=$('language').value;r.interimResults=true;r.continuous=false;r.maxAlternatives=3;let endedByError=false;
 r.onstart=()=>{status.textContent='正在聽… 說完按停止；點文字框可立即編輯。';controls();};
 r.onresult=e=>{
  if(recognition!==r)return;
  // Results are a session snapshot, not new append-only sentences.
  let rendered=base;
  for(let i=0;i<e.results.length;i++){
   const result=e.results[i],words=result[0].transcript;
   const prefix=rendered+(rendered&&!/[\s\n]$/.test(rendered)?' ':'');
   if(result.isFinal)showAlternatives(result,prefix);
   rendered=prefix+words;
  }
  text.value=rendered;persist();
 };
 r.onerror=e=>{if(recognition!==r)return;endedByError=true;failures++;const errors={'not-allowed':'麥克風權限被拒絕。請到 Android 設定 → 應用程式 → 目前瀏覽器 → 權限 → 麥克風，並在瀏覽器的本站設定允許麥克風。給 omalauncher 權限不會同時授權瀏覽器。','service-not-allowed':'瀏覽器不允許此語音服務，請用 Chrome 開啟。','audio-capture':'無法取得麥克風。請確認瀏覽器權限，並關閉其他正在錄音的程式。','network':'語音服務連線失敗，請檢查網路後重試。','no-speech':'沒聽到聲音，請按開始重試。','language-not-supported':'此語音服務不支援所選語言，請切換語言。','aborted':'語音已停止。'};
 status.textContent=errors[e.error]||'辨識錯誤：'+e.error;
 halt(status.textContent);};
 r.onend=()=>{
  if(recognition!==r)return;
  recognition=null;wanted=false;persist();controls();
  if(afterStop){const f=afterStop;afterStop=null;f();}
  else if(!endedByError)status.textContent='辨識已停止。直接點文字框修改，再保存到首頁。';
 };
 try{r.start();controls();}catch(e){recognition=null;halt('無法開始：'+e.message);}
}
function stopForEditing(){
 const r=recognition;recognition=null;wanted=false;clearTimeout(timer);afterStop=null;
 if(r)r.abort();controls();persist();
}
text.onfocus=()=>{if(recognition){stopForEditing();status.textContent='已暫停聽寫，現在可直接編輯文字。';}};
text.oninput=()=>{if(recognition)stopForEditing();persist();};
function switchLanguage(lang){
 stopForEditing();$('language').value=lang;localStorage.setItem('oma-speak-language',lang);failures=0;
 wanted=true;startSession();
}
$('chinese').onclick=()=>switchLanguage(uiLanguage==='zh'?'zh-CN':SPEECH[uiLanguage]);
$('english').onclick=()=>switchLanguage('en-US');
$('language').onchange=()=>localStorage.setItem('oma-speak-language',$('language').value);
function showAlternatives(result,prefix){
 const box=$('alternatives');box.replaceChildren();
 if(result.length<2)return;
 const label=document.createElement('small');label.textContent='最近一句候選（停止後可選）：';box.append(label);
 for(let j=0;j<result.length;j++){
  const b=document.createElement('button');b.textContent=result[j].transcript;
  const original=prefix+result[0].transcript,candidate=prefix+result[j].transcript;
  b.onclick=()=>{if(recognition||wanted){status.textContent='先按停止，再選候選文字。';return;}if(!text.value.startsWith(original)){status.textContent='這句已修改，請直接編輯文字。';return;}text.value=candidate+text.value.slice(original.length);persist();box.replaceChildren();};box.append(b);
 }
}

$('start').onclick=()=>{failures=0;wanted=true;startSession();};
$('stop').onclick=()=>{halt('正在停止…');if(recognition)recognition.stop();else status.textContent='已停止，可保存文字。';};
async function save(){try{if(!token)throw Error('請從首頁「語音輸入」重新開啟。');const r=await fetch('/text',{method:'POST',headers:{'Content-Type':'application/json','X-Speak-Token':token},body:JSON.stringify({text:text.value}),signal:AbortSignal.timeout(10000)});const msg=await r.text();if(!r.ok)throw Error(msg);status.textContent='已保存。回首頁「語音輸入」按「送到目前目標」。';}catch(e){status.textContent='保存失敗：'+e.message;}}
$('save').onclick=()=>{wanted=false;clearTimeout(timer);if(recognition){afterStop=save;recognition.stop();}else save();controls();};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text.value);status.textContent='已複製。';}catch(e){text.focus();text.select();status.textContent='請長按選取的文字並複製。';}};
$('clear').onclick=()=>{halt('已清空。');afterStop=null;if(recognition){recognition.onresult=null;recognition.abort();}text.value='';committed='';interim='';$('alternatives').replaceChildren();persist();};
document.addEventListener('visibilitychange',()=>{if(document.hidden){wanted=false;clearTimeout(timer);if(recognition)recognition.stop();persist();}});
if(!Speech)status.textContent='此瀏覽器不支援語音辨識，請使用 Chrome 開啟。';controls();
</script></html>
